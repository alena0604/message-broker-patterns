[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "message-broker-patterns"
version = "0.1.0"
description = "Educational Python library demonstrating message broker patterns."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "redis[hiredis]>=5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/message_broker_patterns"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "fakeredis>=2.26",
    "ruff>=0.15",
    "pre-commit>=4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
filterwarnings = ["error"]
